packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# Enter the reviewed verification boundary before executing any project code.
# No implicit preverify/postverify (or other pre/post command) on the host.
enablePrePostScripts: false

catalog:
  typescript: 7.0.2
  vitest: 4.1.12

allowBuilds:
  esbuild: true

# Security patches; retain SHA-bound historical consumer manifests unchanged.
overrides:
  'query-string@7.1.3>decode-uri-component': 0.5.1
  'node-forge@<1.4.3': 1.4.3
  'xcode@3.0.1>uuid': 11.1.1
  'vitest@4.1.0': 4.1.12
  'vite@>=7.0.0 <7.3.7': 7.3.7
  'yaml@>=2.0.0 <2.8.3': 2.8.3
  # Fingerprint's published SDK 57 range still selects vulnerable traversal tools.
  # Keep this exception scoped to that consumer; verify real fingerprint output.
  '@expo/fingerprint@0.20.14>glob': 14.0.3
  '@expo/fingerprint@0.20.14>minimatch': 11.0.1

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/metro-runtime@57.0.9'
  - '@expo/prebuild-config@57.0.11'
  - '@expo/ui@57.0.10'
  - expo-asset@57.0.10
  - expo-constants@57.0.10
  - expo-router@57.0.12
  - expo-server@57.0.2
  - expo@57.0.12

patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch

auditConfig: {}
