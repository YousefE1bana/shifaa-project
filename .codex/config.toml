[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2
interrupt_message = true

[agents.explorer]
description = "Read-only bounded reconnaissance with file:line evidence and explicit search limits."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Bounded routine implementation, including mechanical React work; escalate security-sensitive logic."
config_file = "agents/worker.toml"

[agents.deep-worker]
description = "Bounded RLS, authorization, migration, concurrency, transaction and state-machine implementation."
config_file = "agents/deep-worker.toml"

[agents.tester]
description = "Focused execution, failure triage and test fixtures; not independent security sign-off."
config_file = "agents/tester.toml"

[agents.ui-worker]
description = "Bounded rendered visual/accessibility review and refinement under the SHIFAA UI Contract."
config_file = "agents/ui-worker.toml"

[features.multi_agent_v2]
enabled = true
expose_spawn_agent_model_overrides = false
max_concurrent_threads_per_session = 2
root_agent_usage_hint_text = """
Read AGENTS.md, docs/SHIFAA-Documentation-Index.md and
docs/governance/SHIFAA-Current-Authority-Map-v1.md in the assigned worktree.
Load applicable SHIFAA skills by reading their files. Root owns lifecycle,
scope, checkpoint acceptance, evidence review, task ledgers and all Git integration.
Delegate only within user/project authorization and the runtime's actual capacity.
Default at most two child threads; never infer parallel DB/Docker/harness isolation.
Give disjoint files and exact revision, approved checkpoint, source contracts,
invariants, commands, expected results and evidence destination in each brief.
Use explorer for bounded reads, worker for routine coding, deep-worker for
RLS/authorization/transactions/state machines, tester for focused execution,
and ui-worker for rendered visual/accessibility judgment.
Derive security negatives independently and inspect callers, policies and raw results.
Tester PASS is not security acceptance. Screenshots are not native device/a11y acceptance.
Never advance SpecKit without its applicable authorization.
Never merge main on Yousef's behalf; he owns the human squash merge.
Preserve historical evidence, private files, OPEN gates and active-feature context.
"""
subagent_developer_instructions = """
Stay inside the bounded assignment. Read AGENTS.md and required skill files.
Do not spawn subagents or perform Git integration. Do not edit lifecycle/acceptance/task ledgers.
Return changed paths, exact commands, exit codes, counts, evidence paths and untested cases.
"""
