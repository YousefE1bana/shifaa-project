name: GitHub metadata

on:
  issues:
    types: [opened, reopened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, edited, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  validate:
    name: Validate issue and PR metadata labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
      - name: Run metadata validator tests
        run: node --test tools/github-metadata.test.mjs
      - name: Validate event labels
        run: node tools/github-metadata.mjs --validate-github-event "$GITHUB_EVENT_PATH"
