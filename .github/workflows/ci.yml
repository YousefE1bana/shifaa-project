name: SHIFAA CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_ENV: test
  IDENTITY_ONBOARDING_ENABLED: 'true'
  SYNTHETIC_PROOFING_ENABLED: 'true'
  DATABASE_URL: postgresql://shifaa_api:synthetic_api_only@127.0.0.1:5432/shifaa

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format, lint, types, tests, contracts, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm team:test
      - run: node --test tools/start-feature-011-native-supabase.test.mjs tools/reset-feature-011-native-supabase.test.mjs tools/feature-011-native-supabase-bootstrap.test.mjs tools/feature-011-evidence-head.test.mjs tools/feature-011-pr-review-binding.test.mjs
      - run: pnpm contracts:check
      - name: Verify exact F011 and additive F012 migration inventories
        run: |
          git worktree add --detach .tmp/shifaa-f011 fbd2b5312a5038aad21db0001a17dac22bdcbf7e
          node --test tools/verify-feature-012-migration-chain.test.mjs
          node tools/verify-feature-012-migration-chain.mjs .tmp/shifaa-f011
      - run: pnpm architecture:check
      - run: pnpm secrets:check

  database:
    name: PostgreSQL migration and forced-RLS matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config
      - run: docker compose up -d --wait postgres
      - run: pnpm db:migrate
      - run: pnpm db:test
      - run: pnpm db:rls-test
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop local services
        if: always()
        run: docker compose down -v

  supabase-runtime:
    name: Supabase Auth, PostgreSQL, Storage, and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Prepare and verify the exact native predecessor
        run: |
          git worktree add --detach "$RUNNER_TEMP/shifaa-f011" fbd2b5312a5038aad21db0001a17dac22bdcbf7e
          pnpm --dir "$RUNNER_TEMP/shifaa-f011" install --frozen-lockfile
          node tools/verify-feature-012-migration-chain.mjs "$RUNNER_TEMP/shifaa-f011"
      - name: Admit the disposable native runner
        id: native-admission
        env:
          SHIFAA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$SHIFAA_RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          containers=$(docker ps -aq)
          volumes=$(docker volume ls -q)
          test -z "$containers"
          test -z "$volumes"
      - run: pnpm --dir "$RUNNER_TEMP/shifaa-f011" supabase:start
      - name: Run native tests after the verified 38-to-39 migration
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node tools/verify-feature-012-native-supabase.mjs
      - name: Supabase status on failure
        if: failure() && steps.native-admission.outcome == 'success'
        run: pnpm --dir "$RUNNER_TEMP/shifaa-f011" supabase status || true
      - name: Stop Supabase
        if: always() && steps.native-admission.outcome == 'success'
        run: pnpm --dir "$RUNNER_TEMP/shifaa-f011" supabase:stop --no-backup || true

  accessibility-and-e2e:
    name: Accessibility and patient E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:a11y
      - run: pnpm test:e2e

  supply-chain:
    name: Dependencies, secrets, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: pnpm secrets:check
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  sast:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: /language:javascript-typescript
          output: artifacts/codeql-sarif
          upload: never
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: codeql-sarif
          path: artifacts/codeql-sarif/
          if-no-files-found: error
          retention-days: 30
