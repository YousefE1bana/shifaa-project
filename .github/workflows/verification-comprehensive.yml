name: Comprehensive disposable verification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact published source SHA (no floating baseline)
        required: true
        type: string
permissions:
  contents: read
jobs:
  complete:
    name: Complete legacy obligations on disposable hosted VM
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI: 'true'
      NODE_ENV: test
      IDENTITY_ONBOARDING_ENABLED: 'true'
      SYNTHETIC_PROOFING_ENABLED: 'true'
      DATABASE_URL: postgresql://shifaa_api:synthetic_api_only@127.0.0.1:5432/shifaa
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind actual checkout before any resource operation
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(docker ps -aq)"
          test -z "$(docker volume ls -q)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Existing Windows PowerShell command compatibility on hosted Linux
        run: |
          mkdir -p "$RUNNER_TEMP/verification-bin"
          printf '#!/bin/sh\nexec pwsh "$@"\n' > "$RUNNER_TEMP/verification-bin/powershell.exe"
          chmod +x "$RUNNER_TEMP/verification-bin/powershell.exe"
          echo "$RUNNER_TEMP/verification-bin" >> "$GITHUB_PATH"
      - run: docker compose build postgres
      - run: pnpm supabase:start
      - name: Execute every recorded legacy obligation
        run: node tools/verification/comprehensive.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: comprehensive-results-${{ github.sha }}
          path: verification-comprehensive-results.json
          if-no-files-found: warn
          retention-days: 14
