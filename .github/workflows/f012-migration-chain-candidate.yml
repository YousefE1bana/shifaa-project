name: F012 migration-chain candidate
on:
  pull_request:
    paths:
      - '.github/workflows/f012-migration-chain-candidate.yml'
      - '.github/workflows/ci.yml'
      - 'supabase/migrations/20261112001200_f012_source_admission.sql'
      - 'infra/db/tests/feature-012-source-fence.sql'
      - 'tools/verify-feature-012-harness.mjs'
      - 'tools/verify-feature-012-migration-chain.mjs'
      - 'tools/verify-feature-012-migration-chain.test.mjs'
      - 'tools/verify-feature-012-native-supabase.mjs'
permissions:
  contents: read
jobs:
  proof:
    name: Historical F011 and disposable F012 candidate proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate original seals and the complete extended inventory
        run: |
          node --test tools/verify-feature-012-migration-chain.test.mjs
          mkdir -p .tmp/f012-candidate-evidence
          git worktree add --detach .tmp/f012-historical-f011 fbd2b5312a5038aad21db0001a17dac22bdcbf7e
          node tools/verify-feature-012-migration-chain.mjs .tmp/f012-historical-f011 > .tmp/f012-candidate-evidence/chain.json
      - name: Apply the extended chain from scratch and from the sealed baseline
        run: |
          docker pull public.ecr.aws/supabase/postgres@sha256:99b1729aeb0bac314445024fc149fbd39306170b61dd50800ccf180327ab3459
          node tools/verify-feature-012-harness.mjs --source-fence > .tmp/f012-candidate-evidence/fresh.json
          node tools/verify-feature-012-harness.mjs --source-fence-upgrade > .tmp/f012-candidate-evidence/upgrade.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: f012-migration-chain-candidate
          path: .tmp/f012-candidate-evidence/*.json
  native:
    name: Native Supabase F011-to-F012 candidate proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      IDENTITY_ONBOARDING_ENABLED: 'true'
      SYNTHETIC_PROOFING_ENABLED: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Prepare and verify the exact native predecessor
        run: |
          git worktree add --detach "$RUNNER_TEMP/shifaa-f011" fbd2b5312a5038aad21db0001a17dac22bdcbf7e
          pnpm --dir "$RUNNER_TEMP/shifaa-f011" install --frozen-lockfile
          node tools/verify-feature-012-migration-chain.mjs "$RUNNER_TEMP/shifaa-f011"
      - name: Admit the disposable native runner
        id: native-admission
        env:
          SHIFAA_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$SHIFAA_RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          test "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock
          containers=$(docker ps -aq)
          volumes=$(docker volume ls -q)
          test -z "$containers"
          test -z "$volumes"
      - run: pnpm --dir "$RUNNER_TEMP/shifaa-f011" supabase:start
      - name: Run the source fence and Auth, Storage, and RLS after migration 39
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: node tools/verify-feature-012-native-supabase.mjs
      - name: Stop the stack on the admitted disposable runner
        if: always() && steps.native-admission.outcome == 'success'
        run: pnpm --dir "$RUNNER_TEMP/shifaa-f011" supabase:stop --no-backup
