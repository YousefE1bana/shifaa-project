name: F012 migration-chain candidate
on:
  pull_request:
    paths:
      - '.github/workflows/f012-migration-chain-candidate.yml'
      - 'supabase/migrations/20261112001200_f012_source_admission.sql'
      - 'infra/db/tests/feature-012-source-fence.sql'
      - 'tools/verify-feature-012-harness.mjs'
      - 'tools/verify-feature-012-migration-chain.mjs'
      - 'tools/verify-feature-012-migration-chain.test.mjs'
permissions:
  contents: read
jobs:
  proof:
    name: Historical F011 and disposable F012 candidate proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate original seals and the complete extended inventory
        run: |
          node --test tools/verify-feature-012-migration-chain.test.mjs
          mkdir -p .tmp/f012-candidate-evidence
          git worktree add --detach .tmp/f012-historical-f011 fbd2b5312a5038aad21db0001a17dac22bdcbf7e
          node tools/verify-feature-012-migration-chain.mjs .tmp/f012-historical-f011 > .tmp/f012-candidate-evidence/chain.json
      - name: Apply the extended chain in the admitted disposable harness
        run: |
          docker pull public.ecr.aws/supabase/postgres@sha256:99b1729aeb0bac314445024fc149fbd39306170b61dd50800ccf180327ab3459
          node tools/verify-feature-012-harness.mjs --source-fence-upgrade > .tmp/f012-candidate-evidence/upgrade.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: f012-migration-chain-candidate
          path: .tmp/f012-candidate-evidence/*.json
