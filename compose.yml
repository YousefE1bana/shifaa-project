name: shifaa-local
services:
  postgres:
    build:
      context: .
      dockerfile: infra/db/Dockerfile.postgis
    image: shifaa/postgis:17-3.5-006-local
    environment:
      POSTGRES_DB: shifaa
      POSTGRES_USER: shifaa_owner
      POSTGRES_PASSWORD: synthetic_owner_only
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      # The upstream entrypoint briefly starts a temporary bootstrap server.
      # Require the final PID 1 postmaster so `--wait` cannot release migrations
      # against that disposable initialization process.
      test:
        [
          'CMD-SHELL',
          'test "$(head -n 1 "$${PGDATA}/postmaster.pid" 2>/dev/null)" = "1" && pg_isready -U shifaa_owner -d shifaa',
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - shifaa-postgres-data:/var/lib/postgresql/data
      - ./:/workspace:ro
    security_opt:
      - no-new-privileges:true

volumes:
  shifaa-postgres-data:
