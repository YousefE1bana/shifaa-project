name: shifaa-local
services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: shifaa
      POSTGRES_USER: shifaa_owner
      POSTGRES_PASSWORD: synthetic_owner_only
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shifaa_owner -d shifaa']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - shifaa-postgres-data:/var/lib/postgresql/data
      - ./:/workspace:ro
    security_opt:
      - no-new-privileges:true

volumes:
  shifaa-postgres-data:
