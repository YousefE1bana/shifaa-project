schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Cycle"
  version: "3.0.0"
  author: "SHIFAA (based on GitHub Spec Kit)"
  description: "Runs SHIFAA SpecKit stages with evidence-based checkpoints under effective delivery authority."

requires:
  # The installed SpecKit must support the checked-in verdict_input fields.
  # OPEN-TECH-001 retains its toolchain evidence requirement before release use.
  speckit_version: ">=1.4.0"
  integrations:
    # The integration must provide the commands referenced in steps.
    # The list is advisory and not a closed set.
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"
      - "codex"
      - "kimi"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  target_requirements:
    type: string
    required: true
    prompt: "Comma-separated active PRD FR/NFR IDs targeted by this feature"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (default: auto, which dispatches through the project's active integration)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

  # Supply only the reached gate after checking evidence and applicable authority.
  scope_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  spec_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  plan_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  analysis_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  baseline_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]
  finalization_verdict:
    type: string
    default: ""
    enum: ["", approve, reject]

steps:
  - id: scope-eligibility
    type: gate
    verdict_input: scope_verdict
    message: "SHIFAA scope gate: verify every ID in target_requirements exists in the current PRD and is ACTIVE graduation-MVP scope. Reject DEFERRED_POST_MVP, RETIRED, reserved, or unknown IDs. A deferred ID requires an already-approved dated re-entry ADR and synchronized PRD/Master/trace/API/data/UI updates before a new run. On rejection, generate no feature artifacts. The root records the technical decision under effective delivery authority."
    options: [approve, reject]
    on_reject: abort

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }} Target requirement IDs: {{ inputs.target_requirements }}. Record ACTIVE scope evidence from the current PRD."

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "Resolve every NEEDS CLARIFICATION that is objectively answerable from SHIFAA sources. Preserve legal, clinical, UX, and vendor judgment as an OPEN-* blocker."

  - id: review-spec
    type: gate
    verdict_input: spec_verdict
    message: "SHIFAA specification gate: confirm immutable FR/NFR coverage, primary-source research, Egyptian legal checklist, edge/degraded states, deterministic acceptance vectors, and explicit blockers before planning. On rejection, set the feature status to DRAFT and record named findings before this run aborts. The root checks the exact spec and obtains any reserved decision from its owner."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    verdict_input: plan_verdict
    message: "SHIFAA plan gate: confirm Constitution I–XV, exact data/RLS/API/UI/events, migration, threat model, tests, rollout/rollback, and either applicable approvals or an explicit OPEN-* blocker mapped to a disabled capability/release gate. No plan-, safety-test-, or synthetic-implementation blocker may pass to tasks. On rejection, return status to the earliest affected pre-approval state and record named findings before this run aborts. The root accepts the exact engineering Plan under standing delegation after all prerequisites pass."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Check spec, plan, tasks, PRD, Master, contracts, Constitution, and traceability. Any CRITICAL inconsistency blocks implementation."

  - id: review-analysis
    type: gate
    verdict_input: analysis_verdict
    message: "SHIFAA implementation gate: analysis reports zero CRITICAL inconsistencies and tasks contain requirement IDs, exact paths, test/evidence work, and no hidden legal/clinical/design decisions. On rejection, return status to the earliest affected state and record named findings before this run aborts. The root records the result and verifies any applicable reserved decision."
    options: [approve, reject]
    on_reject: abort

  - id: publish-task-baseline
    type: gate
    verdict_input: baseline_verdict
    message: "Commit and push the immutable spec/plan/tasks baseline. Confirm the worktree is clean and local HEAD equals its upstream before GitHub Issue publication. Verify required integration and canonical feature-qualified Issue mapping before publication."
    options: [approve, reject]
    on_reject: abort

  - id: taskstoissues
    command: speckit.taskstoissues
    integration: "{{ inputs.integration }}"
    input:
      args: "Generate or update feature-qualified SHIFAA Issues from the pushed task baseline, using the canonical issue-handoff payload script."

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze-implemented
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Re-run cross-artifact analysis after implementation and report remaining blockers without changing artifacts."

  - id: feature-artifact-finalization
    type: gate
    verdict_input: finalization_verdict
    message: "Apply docs/governance/SHIFAA-Feature-Artifact-Finalization-Gate.md before declaring closeout complete or deleting worktree/branch state. Require reviewed classification of tracked/untracked/relevant ignored material, official outputs in specs/<feature>/, a verified evidence index with retention reasons and current paths/hashes, preserved historical failures and approval limits, no unresolved essential preservation gaps, and verified required artifacts in this feature's merged remote main. Prepare the outputs before PR integration; final approval waits for verified squash integration under effective AGENTS merge authority and the required integration checks. This gate does not execute or authorize merge, cleanup, or successor work. On rejection, record BLOCKED finalization without rewriting historical acceptance. The root closes completed Issues after their closure conditions pass."
    options: [approve, reject]
    on_reject: abort
