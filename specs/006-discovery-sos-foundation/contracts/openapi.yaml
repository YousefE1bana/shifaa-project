openapi: 3.1.1
info:
  title: SHIFAA Discovery and SOS Foundation API
  version: 0.2.0
  description: >-
    Seeded-synthetic Phase 2 contract for the ten existing discovery, capacity,
    SOS, pre-arrival, and emergency-share operations. It does not define a
    capacity writer, ambulance dispatch, bed reservation, production map/SMS,
    or later clinical source lifecycle.
servers:
  - url: /v1
tags:
  - name: Discovery
  - name: SOS
  - name: Hospital SOS
security:
  - bearerAuth: []
paths:
  /discovery/facilities:
    get:
      tags: [Discovery]
      operationId: searchFacilities
      summary: Search active verified facilities using a transient location or manual area
      security:
        - {}
        - bearerAuth: []
      x-shifaa-requirements: [FR-DISC-001]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/FacilityTypeQuery'
        - $ref: '#/components/parameters/ServiceQuery'
        - $ref: '#/components/parameters/NearQuery'
        - $ref: '#/components/parameters/AreaQuery'
        - $ref: '#/components/parameters/RadiusQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Stable page of minimum verified facility projections
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacilitySearchResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /discovery/hospitals/{facilityId}/capacity:
    get:
      tags: [Discovery]
      operationId: getFacilityCapacity
      summary: Read a hospital emergency-capacity aggregate and freshness
      security:
        - {}
        - bearerAuth: []
      x-shifaa-requirements: [FR-HOSP-007, FR-DISC-001]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/FacilityIdPath'
      responses:
        '200':
          description: Aggregate capacity projection with no patient, ward, or bed detail
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityResponse' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
  /sos/incidents:
    post:
      tags: [SOS]
      operationId: createSosIncident
      summary: Explicitly activate a patient SOS and compute an informational match
      x-shifaa-requirements: [FR-SOS-001, FR-SOS-002, FR-SOS-004, FR-FAM-006]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSosIncidentRequest' }
      responses:
        '201':
          description: Created incident; match remains informational until hospital acceptance
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSosIncidentResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
        '503': { $ref: '#/components/responses/UnavailableProblem' }
  /sos/incidents/{incidentId}:
    get:
      tags: [SOS]
      operationId: getSosIncident
      summary: Read a subject or matched-hospital minimum SOS projection
      x-shifaa-requirements: [FR-SOS-001, FR-SOS-002]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IncidentIdPath'
      responses:
        '200':
          description: Authorized incident projection
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosIncidentResponse' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
  /hospitals/{facilityId}/sos-prearrivals:
    get:
      tags: [Hospital SOS]
      operationId: listSosPrearrivals
      summary: List minimum SOS pre-arrivals matched to the current hospital
      x-shifaa-requirements: [FR-SOS-002, FR-HOSP-001]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/FacilityIdPath'
        - name: status
          in: query
          schema:
            type: string
            enum: [matched, accepted]
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CursorQuery'
      responses:
        '200':
          description: Facility-scoped minimum pre-arrival page
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosPrearrivalListResponse' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
  /hospitals/{facilityId}/sos-incidents/{incidentId}/accept:
    post:
      tags: [Hospital SOS]
      operationId: acceptSosPrearrival
      summary: Explicitly accept an informational SOS pre-arrival without reserving a bed
      x-shifaa-requirements: [FR-SOS-002]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/FacilityIdPath'
        - $ref: '#/components/parameters/IncidentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptSosPrearrivalRequest' }
      responses:
        '200':
          description: Accepted pre-arrival; this is not a bed reservation
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosIncidentResponse' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '428': { $ref: '#/components/responses/PreconditionProblem' }
  /sos/incidents/{incidentId}/close:
    post:
      tags: [SOS]
      operationId: closeSosIncident
      summary: Close an active, matched, or accepted SOS incident
      x-shifaa-requirements: [FR-SOS-001]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IncidentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseSosIncidentRequest' }
      responses:
        '200':
          description: Closed incident projection
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosIncidentResponse' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '428': { $ref: '#/components/responses/PreconditionProblem' }
  /sos/incidents/{incidentId}/share-links:
    post:
      tags: [SOS]
      operationId: createEmergencyShare
      summary: Create a one-use scoped emergency-profile capability
      x-shifaa-requirements: [FR-SOS-003]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IncidentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEmergencyShareRequest' }
      responses:
        '201':
          description: Link material shown in this canonical result only and encrypted in idempotency storage
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateEmergencyShareResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
  /sos/share-links/{shareId}/revoke:
    post:
      tags: [SOS]
      operationId: revokeEmergencyShare
      summary: Revoke an unused emergency-share link
      x-shifaa-requirements: [FR-SOS-003]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/ShareIdPath'
      responses:
        '200':
          description: Revoked share summary
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyShareSummary' }
        '401': { $ref: '#/components/responses/AuthenticationProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '428': { $ref: '#/components/responses/PreconditionProblem' }
  /sos/share/{token}:
    get:
      tags: [SOS]
      operationId: viewEmergencyShare
      summary: Consume one valid emergency-share capability and return its minimum scope
      security: []
      x-shifaa-requirements: [FR-SOS-003]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/RequestIdOptional'
        - name: token
          in: path
          required: true
          description: Sensitive bearer material; route logging must replace it before telemetry
          x-sensitive: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: First and only valid minimum emergency-profile view
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            Content-Language: { $ref: '#/components/headers/ContentLanguage' }
            Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
            Pragma: { $ref: '#/components/headers/NoCache' }
            Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyShareViewResponse' }
        '410': { $ref: '#/components/responses/EmergencyShareExpiredProblem' }
        '429': { $ref: '#/components/responses/RateLimitProblem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Server-validated or generated request UUID
      schema: { type: string, format: uuid }
    ContentLanguage:
      description: Selected response locale
      schema: { type: string, enum: [ar-EG, en-EG] }
    PrivateNoStore:
      description: Sensitive response caching policy
      schema: { type: string, const: 'private, no-store' }
    NoCache:
      description: Legacy cache prohibition for bearer response
      schema: { type: string, const: no-cache }
    NoReferrer:
      description: Prevent bearer route disclosure through referrers
      schema: { type: string, const: no-referrer }
    ETag:
      description: Quoted current integer resource version
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: [ar-EG, en-EG], default: ar-EG }
    RequestIdOptional:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    FacilityIdPath:
      name: facilityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentIdPath:
      name: incidentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareIdPath:
      name: shareId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FacilityTypeQuery:
      name: type
      in: query
      schema: { type: string, enum: [clinic, pharmacy, hospital, laboratory] }
    ServiceQuery:
      name: service
      in: query
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9._-]+$' }
    NearQuery:
      name: near
      in: query
      description: Transient `latitude,longitude`; never persisted or logged
      x-sensitive: true
      schema:
        type: string
        pattern: '^-?(?:[0-8]?[0-9](?:\.[0-9]{1,6})?|90(?:\.0{1,6})?),-?(?:1[0-7][0-9](?:\.[0-9]{1,6})?|[0-9]?[0-9](?:\.[0-9]{1,6})?|180(?:\.0{1,6})?)$'
    AreaQuery:
      name: area
      in: query
      schema: { type: string, minLength: 2, maxLength: 100 }
    RadiusQuery:
      name: radius
      in: query
      description: Radius in meters; server configuration provides the default and maximum
      schema: { type: integer, minimum: 100, maximum: 100000 }
    LimitQuery:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    CursorQuery:
      name: cursor
      in: query
      schema: { type: string, minLength: 16, maxLength: 512 }
  responses:
    ValidationProblem:
      description: Request validation failed
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Content-Language: { $ref: '#/components/headers/ContentLanguage' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AuthenticationProblem:
      description: Authentication is required or invalid
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Current actor/context is not authorized
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: Resource is absent or hidden by authorization
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: State, version, freshness, idempotency, or concurrency conflict
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionProblem:
      description: Required If-Match precondition is missing
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitProblem:
      description: Risk-aware rate limit reached; emergency phone guidance remains available in UI
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnavailableProblem:
      description: Required configuration or local capability is unavailable and failed closed
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmergencyShareExpiredProblem:
      description: Link is expired, revoked, used, invalid, or beyond its access limit
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        Cache-Control: { $ref: '#/components/headers/PrivateNoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
        Referrer-Policy: { $ref: '#/components/headers/NoReferrer' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id, errors]
      properties:
        type: { type: string, format: uri }
        title: { type: string, minLength: 1 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, minLength: 1 }
        instance: { type: string }
        code:
          type: string
          enum:
            - authentication-required
            - mfa-required
            - forbidden
            - purpose-required
            - not-found
            - validation-failed
            - state-transition-invalid
            - version-conflict
            - idempotency-key-reused
            - idempotency-in-progress
            - rate-limited
            - vendor-unavailable
            - capacity-stale
            - no-qualifying-capacity
            - sos-incident-terminal
            - sos-not-matched-to-facility
            - sos-permission-required
            - emergency-share-expired
        request_id: { type: string, format: uuid }
        retry_after_seconds: { type: integer, minimum: 1 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string }
              field: { type: string }
              message: { type: string }
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    RatingSummary:
      type: object
      additionalProperties: false
      required: [state, count, average]
      properties:
        state: { type: string, enum: [available, unavailable] }
        count: { type: integer, minimum: 0 }
        average:
          anyOf:
            - { type: number, minimum: 1, maximum: 5 }
            - { type: 'null' }
    CapacityProjection:
      type: object
      additionalProperties: false
      required: [signal, count_band, freshness, observed_at, fresh_until]
      properties:
        signal: { type: string, enum: [available, limited, unavailable, unknown] }
        count_band: { type: string, enum: [none, one_to_four, five_to_nine, ten_or_more, unknown] }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        observed_at:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        fresh_until:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    FacilityProjection:
      type: object
      additionalProperties: false
      required:
        [
          facility_id,
          facility_type,
          name,
          services,
          coordinates,
          distance_m,
          rating_summary,
          operational_signal,
        ]
      properties:
        facility_id: { type: string, format: uuid }
        facility_type: { type: string, enum: [clinic, pharmacy, hospital, laboratory] }
        name: { type: string, minLength: 1, maxLength: 160 }
        address: { type: string, maxLength: 300 }
        services:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        coordinates: { $ref: '#/components/schemas/GeoPoint' }
        distance_m:
          anyOf:
            - { type: number, minimum: 0 }
            - { type: 'null' }
        rating_summary: { $ref: '#/components/schemas/RatingSummary' }
        operational_signal: { $ref: '#/components/schemas/CapacityProjection' }
    FacilitySearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FacilityProjection' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor:
          anyOf:
            - { type: string }
            - { type: 'null' }
    CapacityResponse:
      type: object
      additionalProperties: false
      required: [facility_id, capacity]
      properties:
        facility_id: { type: string, format: uuid }
        capacity: { $ref: '#/components/schemas/CapacityProjection' }
    CreateSosIncidentRequest:
      type: object
      additionalProperties: false
      required:
        [
          managed_patient_id,
          coordinates,
          qualifying_reason_code,
          contact_preference,
          callback_source,
          explicit_activation,
        ]
      properties:
        managed_patient_id: { type: string, format: uuid }
        coordinates: { $ref: '#/components/schemas/GeoPoint' }
        qualifying_reason_code:
          type: string
          enum: [medical_emergency, accident_or_injury, other_life_safety]
        contact_preference: { type: string, enum: [none, all_confirmed] }
        callback_source:
          { type: string, enum: [patient_verified_contact, initiator_verified_contact] }
        explicit_activation: { type: boolean, const: true }
    SosGuidance:
      type: object
      additionalProperties: false
      required: [call_ambulance_123, ambulance_dispatched, bed_reserved]
      properties:
        call_ambulance_123: { type: boolean }
        ambulance_dispatched: { type: boolean, const: false }
        bed_reserved: { type: boolean, const: false }
    SosIncident:
      type: object
      additionalProperties: false
      required:
        [
          incident_id,
          managed_patient_id,
          status,
          qualifying_reason_code,
          matched_facility,
          initiated_at,
          version,
        ]
      properties:
        incident_id: { type: string, format: uuid }
        managed_patient_id: { type: string, format: uuid }
        status: { type: string, enum: [active_unmatched, matched, accepted, closed] }
        qualifying_reason_code:
          { type: string, enum: [medical_emergency, accident_or_injury, other_life_safety] }
        matched_facility:
          anyOf:
            - { $ref: '#/components/schemas/FacilityProjection' }
            - { type: 'null' }
        initiated_at: { type: string, format: date-time }
        accepted_at:
