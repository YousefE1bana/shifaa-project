          uniqueItems: true
          items:
            type: string
            enum:
              - dispensing_records
              - other_medication_history
        overallAssessment:
          const: not_fully_checked
      description:
        D3 minimized P/M source projection. Closed category and coverage; no hidden count,
        source path, signer identity or private source detail. Capture time is read observation, not
        guessed producer update time.
    PatientProjectionReleaseIntent:
      description: Product direction APPROVED; exact C2 permission/wire/Data/RLS amendment pending
        acceptance/integration. Independent explicit P/M subject release at sign; absence releases
        neither. Post-sign release is only the separately specified updatePrescription metadata
        branch, never another signing action.
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - audience
        - projections
        - confirmation
      properties:
        policyVersion:
          const: F012-VP-2/0.2.0
        audience:
          const: subject
        projections:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - P
              - M
        confirmation:
          const: true
    UpdatePrescriptionDraft:
      description:
        Draft input; absent mechanismScenarioRef may yield a genuinely produced incomplete
        result only. T2 mechanism_complete and simulated signing require the separately accepted
        coherent scenario and all G guards. Required producer failure never becomes partial success.
      type: object
      additionalProperties: false
      required:
        - items
        - substitutionAllowed
        - expiresAt
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FixtureInput'
          minItems: 1
          maxItems: 100
        substitutionAllowed:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        mechanismScenarioRef:
          type: string
          format: uuid
    ProjectionReleaseTargets:
      type: object
      additionalProperties: false
      required: []
      properties:
        prescription:
          const: true
        medicationStatementRefs:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      anyOf:
        - required:
            - prescription
        - required:
            - medicationStatementRefs
      description:
        Nonempty independently explicit selection. P targets path prescription/exact signed
        revision; each M UUID must belong to that same authorized P3 signed item set. Semantic
        relation enforced by API and forced RLS, not JSON shape alone.
    PostSignProjectionRelease:
      type: object
      additionalProperties: false
      required:
        - action
        - policyVersion
        - audience
        - expectedSignedRevisionRef
        - expectedPrescriptionVersion
        - expectedProjectionControlVersion
        - confirmation
        - targets
      properties:
        action:
          const: release_patient_projection
        policyVersion:
          const: F012-VP-2/0.2.0
        audience:
          const: subject
        expectedSignedRevisionRef:
          type: string
          format: uuid
        expectedPrescriptionVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        expectedProjectionControlVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        confirmation:
          const: true
        targets:
          $ref: '#/components/schemas/ProjectionReleaseTargets'
      description:
        Only current signed/unexpired source; original prescribing person with distinct release
        permission, current care/facility/purpose/AAL2/fresh TOTP. Atomic projection metadata only;
        no sign/clinical edit/P2/P3 effect. All targets authorize or entire operation fails.
    PostSignProjectionWithdrawal:
      type: object
      additionalProperties: false
      required:
        - action
        - policyVersion
        - audience
        - expectedSignedRevisionRef
        - expectedPrescriptionVersion
        - expectedProjectionControlVersion
        - confirmation
        - releaseRefs
        - reasonCategory
      properties:
        action:
          const: withdraw_patient_projection
        policyVersion:
          const: F012-VP-2/0.2.0
        audience:
          const: subject
        expectedSignedRevisionRef:
          type: string
          format: uuid
        expectedPrescriptionVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        expectedProjectionControlVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        confirmation:
          const: true
        releaseRefs:
          type: array
          minItems: 1
          maxItems: 101
          uniqueItems: true
          items:
            type: string
            format: uuid
        reasonCategory:
          enum:
            - patient_request
            - correction
            - privacy_restriction
            - synthetic_policy
      description: Exact releases on this resource only; independent current withdrawal permission.
        Historical cancelled/superseded/expired releases may be withheld. Append-only terminal
        withdrawal; cannot erase prior disclosure or edit signed bytes.
    ProjectionControlResult:
      type: object
      additionalProperties: false
      required:
        - kind
        - action
        - prescriptionRef
        - signedRevisionRef
        - prescriptionVersion
        - projectionControlVersion
        - changedReleaseRefs
        - receipt
      properties:
        kind:
          const: projection_control
        action:
          enum:
            - release_patient_projection
            - withdraw_patient_projection
        prescriptionRef:
          type: string
          format: uuid
        signedRevisionRef:
          type: string
          format: uuid
        prescriptionVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        projectionControlVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        changedReleaseRefs:
          type: array
          minItems: 1
          maxItems: 101
          uniqueItems: true
          items:
            type: string
            format: uuid
        receipt:
          $ref: '#/components/schemas/Receipt'
    UpdatePrescriptionResult:
      oneOf:
        - $ref: '#/components/schemas/PrescriptionMutation'
        - $ref: '#/components/schemas/ProjectionControlResult'
      description:
        Server must return the result for the authorized request branch. Metadata branch cannot
        fabricate safetyResult or a new signature; draft branch retains required atomic safety
        result.
    ProjectionControlRead:
      type: object
      additionalProperties: false
      required:
        - signedRevisionRef
        - version
        - etag
        - prescription
        - medications
      properties:
        signedRevisionRef:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        etag:
          type: string
          pattern: ^"ppc:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]*"$
        prescription:
          $ref: '#/components/schemas/ProjectionTargetControl'
        medications:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - statementRef
              - control
            properties:
              statementRef:
                type: string
                format: uuid
              control:
                $ref: '#/components/schemas/ProjectionTargetControl'
      description:
        C-only conditional control projection for original prescribing person with current
        resource release or withdrawal permission and current care/facility/AAL2/fresh TOTP. Omit
        entirely for other C readers and all P/M/R. Exact target UUIDs are not extra patient
        disclosure.
    ProjectionTargetControl:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          enum:
            - unreleased
            - released
            - withdrawn
        releaseRef:
          type: string
          format: uuid
      allOf:
        - if:
            properties:
              state:
                enum:
                  - released
                  - withdrawn
            required:
              - state
          then:
            required:
              - releaseRef
          else:
            not:
              required:
                - releaseRef
