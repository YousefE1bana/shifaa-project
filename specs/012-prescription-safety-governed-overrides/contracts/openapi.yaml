components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Existing native F007 session, current authority checked server-side; no JWT-only role grants.
  parameters:
    Purpose:
      name: X-Purpose
      in: header
      required: true
      description:
        Existing-style requested purpose carrier; server validates current action, scope and
        purpose independently. Comma-separated tokens as in F011; no purpose value grants access.
        Exact F012 action/purpose mapping requires API/Security acceptance.
      schema:
        type: string
        minLength: 1
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
          - ar-EG
          - en-EG
      description: Default ar-EG.
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Actor/operation/resource-bound; authorization precedes stored payload disclosure.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Strong numeric aggregate ETag. Exact aggregate specified per operation; evidence
        fingerprint is separate.
    UpdateIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        oneOf:
          - type: string
            pattern: ^"[1-9][0-9]*"$
          - type: string
            pattern: ^"ppc:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]*"$
      description: Draft branch requires numeric prescription ETag; projection branch requires exact
        ppc:<resource UUID>:<signed revision UUID>:<control version> ETag plus matching body/actual
        versions. Cross-branch token rejected. Strong clinical GET ETag remains distinct; authorized
        C.projectionControl.etag supplies metadata token.
  headers:
    RequestId:
      schema:
        type: string
        format: uuid
      description: Always returned.
    CacheControl:
      schema:
        const: private, no-store
      description: All authenticated responses.
    ContentLanguage:
      schema:
        type: string
        enum:
          - ar-EG
          - en-EG
      description: Selected locale.
    ETag:
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Current authorized aggregate version, not an evidence hash.
    UpdateETag:
      schema:
        oneOf:
          - type: string
            pattern: ^"[1-9][0-9]*"$
          - type: string
            pattern: ^"ppc:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]*"$
      description:
        'Draft result: strong numeric clinical ETag. Projection-control result: strong ppc
        resource/signed-revision/control ETag. Header and body versions must match the authorized
        request branch.'
  responses:
    Problem400:
      description: 'Malformed request or closed-query/unknown-field failure: validation-failed.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem400'
    Problem401:
      description: 'No current native session: authentication-required.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem401'
    Problem403:
      description: 'Known authorized resource but forbidden action/purpose/AAL: forbidden,
        purpose-required or mfa-required. Never object existence oracle.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem403'
    Problem404:
      description: 'Absent OR not currently visible object: not-found; no hidden source metadata.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem404'
    Problem409:
      description: Version/evidence/state/idempotency conflict; original code family retained.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem409'
    Problem422:
      description:
        'Well-formed domain prerequisite invalid: validation-failed, state-transition-invalid,
        clinical-gate-disabled or legal-gate-disabled.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem422'
    Problem429:
      description: Rate limited; no state effects.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem429'
    Problem503:
      description: 'Required producer/authority unavailable: vendor-unavailable; no false success.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem503'
  schemas:
