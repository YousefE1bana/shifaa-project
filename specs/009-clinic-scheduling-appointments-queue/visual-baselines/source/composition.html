  <script>
  const q=new URLSearchParams(location.search);const baseline=q.get('baseline')||'F009-P0-PAT-DISCOVER-001';const state=q.get('state')||'results';const locale=q.get('locale')||'ar-EG';const app=baseline.includes('-CLN-')?'clinic':'patient';document.documentElement.lang=locale;document.documentElement.dir=locale==='ar-EG'?'rtl':'ltr';
  const ar=locale==='ar-EG';const t=(a,e)=>ar?a:e;const iso=s=>`<bdi dir="ltr">${s}</bdi>`;
  const routeMap={
   'F009-P0-PAT-DISCOVER-001':['/discover',t('ابحث عن طبيب','Find a doctor'),t('اختر طبيبًا مرخصًا في منشأة موثقة، واعرف أقرب موعد متاح.','Choose a licensed doctor at a verified facility and see the next available slot.')],
   'F009-P0-PAT-DOCTOR-001':['/doctors/:id',t('د. مريم التجريبية','Dr. Mariam Test'),t('باطنة عامة · عيادة النور التجريبية','General medicine · Al Noor Test Clinic')],
   'F009-P0-PAT-BOOK-001':['/appointments/new',t('تأكيد الموعد','Confirm appointment'),t('راجع بيانات الشخص والطبيب والموعد قبل التأكيد.','Review the person, doctor, and time before confirming.')],
   'F009-P0-PAT-APPOINTMENT-001':['/appointments/:id',t('تفاصيل الموعد','Appointment details'),t('المرجع ','Reference ')+iso('APT-009-1842')],
   'F009-P0-CLN-TODAY-001':['/today',t('مواعيد اليوم','Today’s appointments'),t('قائمة العمل الخاصة بالطبيب والتاريخ المحددين.','Worklist for the selected doctor and civil date.')],
   'F009-P0-CLN-QUEUE-001':['/queue',t('قائمة الانتظار','Queue'),t('ترتيب مباشر داخل نطاق المنشأة والطبيب والتاريخ.','Live order scoped to facility, doctor, and civil date.')],
   'F009-P0-CLN-SCHEDULE-001':['/schedule',t('جدول الطبيب','Doctor schedule'),t('ساعات العمل الأسبوعية والاستثناءات بالتوقيت المحلي للعيادة.','Weekly clinic hours and exceptions in the clinic’s local time.')],
   'F009-P0-CLN-APPOINTMENT-001':['/appointments/:id',t('موعد المريضة','Patient appointment'),t('المرجع ','Reference ')+iso('APT-009-1842')]
  };
  const info=routeMap[baseline]||routeMap['F009-P0-PAT-DISCOVER-001'];
  const stateText={
   'loading':[t('جارٍ تحميل البيانات','Loading data'),t('يتم جلب أحدث حالة موثوقة.','Fetching the latest authoritative state.'),'info'],
   'empty':[t('لا توجد نتائج','Nothing here yet'),t('لا توجد بيانات تطابق النطاق الحالي.','No data matches the current scope.'),'info'],
   'location-denied':[t('تعذر استخدام الموقع','Location unavailable'),t('استخدم البحث اليدوي حسب المنشأة أو التخصص.','Use manual facility or specialty search.'),'warning'],
   'stale':[t('قد تكون البيانات قديمة','Data may be outdated'),t('آخر تحديث 09:42. حدّث قبل تنفيذ أي إجراء.','Last updated 09:42. Refresh before acting.'),'warning'],
   'offline':[t('أنت غير متصل','You are offline'),t('تظهر آخر بيانات معروفة. لن يتم حفظ أي إجراء دون اتصال.','Last-known data is shown. No action will be queued offline.'),'warning'],
   'conflict':[t('تغيّرت البيانات','The data changed'),t('تم الاحتفاظ بمدخلاتك. حدّث الحالة واختر من البيانات الحالية.','Your input is preserved. Refresh and choose from current data.'),'danger'],
   'overlap-conflict':[t('تداخل غير مسموح','Overlap is not allowed'),t('هذا الاستثناء يتداخل مع استثناء من النوع نفسه. لم يتم حفظ أي تغيير.','This exception overlaps the same type. Nothing was saved.'),'danger'],
   'error-recoverable':[t('تعذر إكمال الطلب','Could not complete the request'),t('حاول مرة أخرى. لم يتم تسجيل نجاح غير مؤكد.','Try again. No uncertain success was recorded.'),'danger'],
   'error-terminal':[t('لا يمكن متابعة المهمة','This task cannot continue'),t('ارجع بأمان أو تواصل مع مسؤول العيادة.','Return safely or contact the clinic administrator.'),'danger'],
   'permission-denied':[t('لا يمكنك الوصول في هذا السياق','Access is unavailable in this context'),t('تحقق من الشخص أو المنشأة أو الصلاحية الحالية.','Check the current person, facility, or permission.'),'danger'],
   'submitting':[t('جارٍ تنفيذ الإجراء','Action in progress'),t('انتظر النتيجة الموثوقة ولا ترسل الطلب مرة أخرى.','Wait for the authoritative result; do not submit again.'),'info'],
   'success':[t('تم الإجراء بنجاح','Action completed'),t('الحالة: مؤكد · المرجع APT-009-1842 · الساعة 10:18','Status: confirmed · Reference APT-009-1842 · 10:18'),'success'],
   'delay-active':[t('تأخير حالي: 20 دقيقة','Current delay: 20 minutes'),t('تغير وقت الانتظار المتوقع فقط؛ لم يتغير ترتيب الدور أو وقت الموعد.','Only the wait estimate changed; queue order and appointment time did not.'),'warning'],
   'absence-active':[t('غياب الطبيب مسجل','Doctor absence recorded'),t('المواعيد المتقاطعة فقط تحتاج إلى إعادة جدولة.','Only intersecting appointments require rescheduling.'),'warning'],
   'absence-review':[t('راجع أثر الغياب','Review absence impact'),t('سيتأثر موعدان وستُزال أدوارهما النشطة عند التأكيد.','Two appointments will be affected and their active queue entries removed.'),'warning'],
   'no-slots':[t('لا توجد مواعيد متاحة','No slots available'),t('اختر تاريخًا آخر لنفس الطبيب والمنشأة.','Choose another date for the same doctor and facility.'),'info'],
   'reschedule-required':[t('يلزم إعادة الجدولة','Rescheduling required'),t('اختر موعدًا مستقبليًا متاحًا؛ الاقتراح لا يحجز الموعد.','Choose an available future slot; suggestions do not hold a slot.'),'warning']
  };
  const labelState=s=>s.replaceAll('-', ' ');const banner=stateText[state]?`<section class="alert ${stateText[state][2]}" role="${stateText[state][2]==='danger'?'alert':'status'}"><div class="alert-icon">${stateText[state][2]==='success'?'✓':stateText[state][2]==='danger'?'!':'i'}</div><div><h2>${stateText[state][0]}</h2><p>${stateText[state][1]}</p></div></section>`:'';
  const btn=(label,kind='')=>`<button class="btn ${kind}" ${['offline','stale','loading','submitting','permission-denied','error-terminal'].includes(state)?'disabled':''}>${label}</button>`;
  const stateBadge=()=>{let cls=state.includes('cancel')||state.includes('removed')?'danger':state.includes('delay')||state.includes('required')||state.includes('stale')?'warning':state.includes('confirm')||state==='completed'||state==='success'?'success':'info';return `<span class="badge ${cls}">${labelState(state)}</span>`};
  const skeleton=()=>`<div class="grid"><div class="skeleton md"></div><div class="skeleton lg"></div><div class="skeleton lg"></div></div>`;
  function filters(){return `<section class="filters" aria-label="${t('عوامل التصفية','Filters')}"><div class="field"><label>${t('التخصص','Specialty')}</label><select><option>${t('باطنة عامة','General medicine')}</option></select></div><div class="field"><label>${t('المنشأة','Facility')}</label><select><option>${t('عيادة النور التجريبية','Al Noor Test Clinic')}</option></select></div><div class="field"><label>${t('التاريخ','Date')}</label><input value="${ar?'١٤ سبتمبر ٢٠٢٦':'14 Sep 2026'}"></div><div class="field"><label>${t('التوفر','Availability')}</label><select><option>${t('أقرب موعد','Next available')}</option></select></div><div class="actions">${btn(t('تطبيق','Apply'),'primary')}${btn(t('مسح','Clear'))}</div></section>`}
  function clinicFilters(){return `<section class="filters" aria-label="${t('نطاق قائمة العمل','Worklist scope')}"><div class="field"><label>${t('الطبيب','Doctor')}</label><select><option>${t('د. مريم التجريبية','Dr. Mariam Test')}</option></select></div><div class="field"><label>${t('التاريخ المدني للعيادة','Clinic civil date')}</label><input value="${ar?'١٤ سبتمبر ٢٠٢٦':'14 Sep 2026'}"></div><div class="actions">${btn(t('تطبيق','Apply'),'primary')}${btn(t('مسح','Clear'))}</div></section>`}
  function doctorCard(){return `<article class="card"><div class="doctor"><div class="doctor-photo">م</div><div><div class="actions"><h2>${t('د. مريم التجريبية','Dr. Mariam Test')}</h2><span class="badge success">${t('ترخيص موثق','Verified licence')}</span></div><p class="muted">${t('باطنة عامة · عيادة النور التجريبية','General medicine · Al Noor Test Clinic')}</p></div></div><div class="meta"><span>${t('أقرب موعد: ١٤ سبتمبر، ١٠:٣٠','Next: 14 Sep, 10:30')}</span><span class="price">${t('٣٥٠ ج.م','EGP 350')}</span></div><div class="actions">${btn(t('عرض الطبيب','View doctor'),'primary')}${btn(t('عرض المواعيد','View times'))}</div></article>`}
  function discover(){if(state==='loading')return filters()+skeleton();if(state==='empty')return filters()+empty(t('لا يوجد أطباء مطابقون','No matching doctors'),t('غيّر التخصص أو المنشأة أو التاريخ.','Change specialty, facility, or date.'));return filters()+`<div class="page-head"><div><h2>${t('طبيبان متاحان','2 doctors available')}</h2><p>${t('منشآت وتراخيص موثقة فقط','Verified facilities and licences only')}</p></div></div><div class="grid cols-2">${doctorCard()}${doctorCard()}</div>`}
  function doctor(){if(state==='loading')return skeleton();if(state==='no-slots')return doctorCard()+empty(t('لا توجد مواعيد في هذا اليوم','No times on this day'),t('اختر تاريخًا آخر.','Choose another date.'));return `${doctorCard()}<section class="card" style="margin-top:16px"><h2>${t('اختر الموعد','Choose a time')}</h2><p class="muted">${t('الاثنين ١٤ سبتمبر · Africa/Cairo','Monday 14 September · Africa/Cairo')}</p><div class="slot-grid"><button class="slot">09:30</button><button class="slot selected">10:30</button><button class="slot">11:00</button><button class="slot">12:30</button><button class="slot">13:00</button></div><div class="actions">${btn(t('متابعة الحجز','Continue to booking'),'primary')}</div></section>`}
  function booking(){if(state==='loading')return skeleton();return `<section class="card"><h2>${t('ملخص الموعد','Appointment summary')}</h2><dl class="summary-list"><div class="summary-row"><dt>${t('الشخص','Person')}</dt><dd>${t('المريضة التجريبية 009','Test Patient 009')}</dd></div><div class="summary-row"><dt>${t('الطبيب','Doctor')}</dt><dd>${t('د. مريم التجريبية','Dr. Mariam Test')}</dd></div><div class="summary-row"><dt>${t('الموعد','Time')}</dt><dd>${t('١٤ سبتمبر، ١٠:٣٠','14 Sep, 10:30')}</dd></div><div class="summary-row"><dt>${t('الرسوم','Fee')}</dt><dd>${t('٣٥٠ ج.م · نقدًا عند الوصول','EGP 350 · cash on arrival')}</dd></div></dl><label style="display:flex;gap:10px;align-items:flex-start;margin-block:16px"><input type="checkbox" checked style="width:22px;height:22px"><span>${t('أؤكد أن الموعد للشخص الموضح أعلاه.','I confirm this appointment is for the person shown above.')}</span></label><div class="actions">${btn(t('تأكيد الموعد','Confirm appointment'),'primary')}${btn(t('العودة للمواعيد','Back to times'))}</div></section>`}
  function appointment(){if(state==='loading')return skeleton();const replacement=state==='reschedule-required'?`<section class="card" style="margin-top:16px"><h2>${t('مواعيد بديلة','Replacement suggestions')}</h2><p class="muted">${t('لا يوجد حجز مؤقت حتى تؤكد إعادة الجدولة.','No slot is held until rescheduling succeeds.')}</p><div class="slot-grid"><button class="slot selected">15 Sep · 09:30</button><button class="slot">15 Sep · 11:00</button></div>${btn(t('إعادة الجدولة','Reschedule'),'primary')}</section>`:'';const mutable=state==='confirmed'||state==='cancel-confirmation'||state==='submitting';const required=state==='reschedule-required';const controls=mutable?`${btn(t('تسجيل الوصول','Check in'),'primary')}${btn(t('إعادة الجدولة','Reschedule'))}${btn(t('إلغاء الموعد','Cancel'),'danger')}`:required?`${btn(t('إعادة الجدولة','Reschedule'),'primary')}${btn(t('إلغاء الموعد','Cancel'),'danger')}`:`${btn(t('تحديث','Refresh'))}`;return `<div class="grid cols-2"><section class="card"><div class="actions" style="justify-content:space-between"><h2>${t('الموعد','Appointment')}</h2>${stateBadge()}</div><dl class="summary-list"><div class="summary-row"><dt>${t('الطبيب','Doctor')}</dt><dd>${t('د. مريم التجريبية','Dr. Mariam Test')}</dd></div><div class="summary-row"><dt>${t('المنشأة','Facility')}</dt><dd>${t('عيادة النور التجريبية','Al Noor Test Clinic')}</dd></div><div class="summary-row"><dt>${t('الوقت','Time')}</dt><dd>${t('١٤ سبتمبر، ١٠:٣٠','14 Sep, 10:30')}</dd></div><div class="summary-row"><dt>${t('الدفع','Payment')}</dt><dd>${t('٣٥٠ ج.م · نقدًا عند الوصول','EGP 350 · cash on arrival')}</dd></div></dl><div class="actions">${controls}</div></section><section class="card"><h2>${t('حالة الانتظار','Queue status')}</h2><div class="queue-number">${state.includes('queue')?'3':'—'}</div><p class="muted">${t('الانتظار المتوقع ٢٥ دقيقة','Estimated wait 25 minutes')}</p><span class="badge info">${state.includes('queue')?labelState(state):t('لم يبدأ الدور','Not checked in')}</span></section></div>${replacement}`}
  function today(){if(state==='loading')return clinicFilters()+skeleton();if(state==='empty')return clinicFilters()+empty(t('لا توجد مواعيد اليوم','No appointments today'),t('غيّر الطبيب أو التاريخ.','Change doctor or date.'));return clinicFilters()+`<div class="grid cols-2"><section><table class="work-table"><thead><tr><th>${t('الوقت','Time')}</th><th>${t('المريضة','Patient')}</th><th>${t('الحالة','Status')}</th><th>${t('الإجراء','Action')}</th></tr></thead><tbody><tr><td>09:30</td><td>${t('المريضة التجريبية 009','Test Patient 009')}</td><td><span class="badge success">confirmed</span></td><td>${btn(t('عرض','View'))}</td></tr><tr><td>10:30</td><td>${t('المريضة التجريبية 014','Test Patient 014')}</td><td><span class="badge info">checked_in</span></td><td>${btn(t('عرض','View'))}</td></tr><tr><td>11:00</td><td>${t('المريضة التجريبية 021','Test Patient 021')}</td><td><span class="badge warning">reschedule_required</span></td><td>${btn(t('عرض','View'))}</td></tr></tbody></table></section><aside class="card"><h2>${t('ملخص التشغيل','Operations summary')}</h2><dl class="summary-list"><div class="summary-row"><dt>${t('المواعيد','Appointments')}</dt><dd>8</dd></div><div class="summary-row"><dt>${t('تم الوصول','Checked in')}</dt><dd>3</dd></div><div class="summary-row"><dt>${t('التأخير الحالي','Current delay')}</dt><dd>${t('٢٠ دقيقة','20 min')}</dd></div></dl></aside></div>`}
  function queue(){if(state==='loading')return skeleton();if(state==='empty')return empty(t('قائمة الانتظار فارغة','The queue is empty'),t('ستظهر حالات الوصول الموثوقة هنا.','Authoritative check-ins will appear here.'));const rows=[['1','009','called'],['2','014','waiting'],['3','021',state.includes('in-service')?'in_service':'waiting'],['4','028',state==='removed'?'removed':'waiting']];return `<div class="grid cols-2"><section class="queue-list">${rows.map((r,i)=>`<article class="queue-row ${i===1?'current':''}"><div class="queue-pos">${r[0]}</div><div><strong>${t('المريضة التجريبية ','Test Patient ')}${r[1]}</strong><div class="muted">${r[2]} · ${t('انتظار ','Wait ')}${10+i*8} ${t('د','min')}</div></div><div class="actions">${r[2]==='waiting'?btn(t('نداء','Call'),'primary'):r[2]==='called'?btn(t('إكمال','Complete'),'primary'):''}${r[2]==='waiting'?btn(t('إعادة ترتيب','Reorder')):''}</div></article>`).join('')}</section><aside class="card"><h2>${t('نطاق القائمة','Queue scope')}</h2><dl class="summary-list"><div class="summary-row"><dt>${t('الطبيب','Doctor')}</dt><dd>${t('د. مريم التجريبية','Dr. Mariam Test')}</dd></div><div class="summary-row"><dt>${t('التاريخ','Date')}</dt><dd>${t('١٤ سبتمبر','14 Sep')}</dd></div><div class="summary-row"><dt>${t('آخر تحديث','Updated')}</dt><dd>10:18</dd></div></dl></aside></div>`}
  function schedule(){if(state==='loading')return skeleton();if(state==='empty')return `<section class="card empty"><div class="empty-mark">＋</div><h2>${t('لا يوجد جدول لهذا النطاق','No schedule for this scope')}</h2><p class="muted">${t('أنشئ جدولًا أسبوعيًا واحدًا للطبيب والمنشأة.','Create one weekly schedule for this doctor and facility.')}</p>${btn(t('إنشاء جدول','Create schedule'),'primary')}</section>`;const days=[t('الأحد','Sunday'),t('الاثنين','Monday'),t('الثلاثاء','Tuesday'),t('الأربعاء','Wednesday'),t('الخميس','Thursday')];const retired=state==='retired-readonly'||state==='retire-confirmation';const statusActions=retired?btn(t('تحديث','Refresh')):`${btn(t('تحديث الجدول','Update schedule'),'primary')}${btn(state==='paused'?t('استئناف الجدول','Resume schedule'):t('إيقاف الجدول مؤقتًا','Pause schedule'))}${btn(t('إنهاء الجدول','Retire schedule'),'danger')}`;const exceptionActions=retired?`<p class="muted">${t('الجدول المنتهي للقراءة فقط.','A retired schedule is read-only.')}</p>`:`<div class="actions">${btn(t('إضافة استثناء','Add exception'))}${btn(t('إعلان تأخير','Declare delay'))}${btn(t('إعلان غياب','Declare absence'),'danger')}</div>`;return `<div class="grid cols-2"><section class="card"><div class="actions" style="justify-content:space-between"><h2>${t('ساعات العمل الأسبوعية','Weekly hours')}</h2>${stateBadge()}</div><p class="muted">${iso('Africa/Cairo')} · ${t('١–٣٠ سبتمبر ٢٠٢٦','1–30 Sep 2026')}</p><div class="schedule-week">${days.map((d,i)=>`<div class="day-row"><strong>${d}</strong><div><div class="timeline"><span style="width:${55+i*6}%"></span></div><small class="muted">09:00–15:00</small></div>${retired?'':btn(t('تعديل','Edit'))}</div>`).join('')}</div><div class="actions" style="margin-top:16px">${statusActions}</div></section><aside class="card"><h2>${t('الاستثناءات','Exceptions')}</h2><div class="meta"><span class="badge warning">blocked</span><span>${t('١٦ سبتمبر · ١٢:٠٠–١٣:٠٠','16 Sep · 12:00–13:00')}</span></div><div class="meta"><span class="badge info">added</span><span>${t('١٧ سبتمبر · ١٦:٠٠–١٨:٠٠','17 Sep · 16:00–18:00')}</span></div>${exceptionActions}</aside></div>`}
  function empty(title,copy){return `<section class="card empty"><div class="empty-mark">＋</div><h2>${title}</h2><p class="muted">${copy}</p>${btn(t('تحديث','Refresh'))}</section>`}
  function confirmation(){if(state==='cancel-confirmation')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title" tabindex="-1">${t('تأكيد إلغاء الموعد','Confirm appointment cancellation')}</h2><p>${t('سيُحرر الموعد ولن يتغير أي سجل انتظار بعد تسجيل الوصول.','The slot will be released. No queue record is changed after check-in.')}</p><div class="review-box"><strong>${iso('APT-009-1842')} · ${t('د. مريم التجريبية','Dr. Mariam Test')}</strong><span>${t('عيادة النور التجريبية · ١٤ سبتمبر، ١٠:٣٠','Al Noor Test Clinic · 14 Sep, 10:30')}</span></div><div class="actions">${btn(t('العودة دون إلغاء','Keep appointment'))}${btn(t('إلغاء الموعد','Cancel appointment'),'danger')}</div></section></div>`;if(state==='absence-confirmation')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title" tabindex="-1">${t('تأكيد غياب الطبيب','Confirm doctor absence')}</h2><p>${t('سيتحول موعدان متقاطعان إلى يلزم إعادة الجدولة، وستُزال أدوارهما النشطة ذريًا.','Two intersecting appointments will require rescheduling and their active queue entries will be removed atomically.')}</p><div class="review-box"><strong>${t('د. مريم التجريبية · عيادة النور التجريبية','Dr. Mariam Test · Al Noor Test Clinic')}</strong><span>${t('١٤ سبتمبر · ١٢:٠٠–١٥:٠٠ · Africa/Cairo','14 Sep · 12:00–15:00 · Africa/Cairo')}</span></div><div class="field"><label>${t('سبب مقيّد مطلوب','Restricted reason required')}</label><textarea class="reason">${t('سبب تشغيلي مختصر','Brief operational reason')}</textarea></div><div class="actions" style="margin-top:16px">${btn(t('العودة','Go back'))}${btn(t('تأكيد الغياب','Confirm absence'),'danger')}</div></section></div>`;if(state==='retire-confirmation')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title" tabindex="-1">${t('إنهاء الجدول نهائيًا؟','Retire this schedule permanently?')}</h2><p>${t('الحالة retired نهائية. لن يتغير أي موعد قائم ضمن هذا الإجراء.','The retired state is terminal. This action does not alter existing appointments.')}</p><div class="review-box"><strong>${t('جدول د. مريم التجريبية','Dr. Mariam Test schedule')}</strong><span>${t('١–٣٠ سبتمبر ٢٠٢٦ · Africa/Cairo','1–30 Sep 2026 · Africa/Cairo')}</span></div><div class="actions">${btn(t('العودة','Go back'))}${btn(t('إنهاء الجدول','Retire schedule'),'danger')}</div></section></div>`;if(state==='reorder-review')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title" tabindex="-1">${t('راجع إعادة ترتيب الدور','Review queue reorder')}</h2><p>${t('يطبق فقط على حالة waiting وفي نطاق الطبيب والتاريخ الحاليين. لا تتغير حالة الموعد.','Applies only to waiting in the current doctor/date scope. Appointment state does not change.')}</p><div class="review-box"><strong>${t('المريضة التجريبية 014 · من ٢ إلى ٣','Test Patient 014 · position 2 to 3')}</strong><span>${t('نسخة القائمة 18 · عيادة النور التجريبية','Queue version 18 · Al Noor Test Clinic')}</span></div><div class="field"><label>${t('سبب مقيّد مطلوب','Restricted reason required')}</label><textarea class="reason">${t('سبب تشغيلي مختصر','Brief operational reason')}</textarea></div><div class="actions" style="margin-top:16px">${btn(t('العودة','Go back'))}${btn(t('تأكيد إعادة الترتيب','Confirm reorder'),'primary')}</div></section></div>`;return ''}
  function clinicContext(){return `<section class="context"><div class="context-main"><div class="avatar">ن</div><div><strong>${t('عيادة النور التجريبية','Al Noor Test Clinic')}</strong><small>${t('طبيب · تحقق AAL2 · بيئة تجريبية','Doctor · AAL2 verified · Test environment')}</small></div></div>${btn(t('تغيير النطاق','Change scope'))}</section>`}
  function patientContext(){return `<section class="context"><div class="context-main"><div class="avatar">009</div><div><strong>${t('المريضة التجريبية 009','Test Patient 009')}</strong><small>${t('حسابي · سياق مؤكد','Self · Context confirmed')}</small></div></div><button class="link-button">${t('تغيير الشخص','Switch person')}</button></section>`}
  function sidebar(){return `<nav class="sidebar" aria-label="${t('التنقل الرئيسي','Primary navigation')}"><div class="side-title">${t('مساحة العيادة','CLINIC WORKSPACE')}</div><a class="side-item ${baseline.includes('TODAY')?'active':''}" href="#"><span class="side-dot"></span>${t('اليوم','Today')}</a><a class="side-item ${baseline.includes('QUEUE')?'active':''}" href="#"><span class="side-dot"></span>${t('الانتظار','Queue')}</a><a class="side-item ${baseline.includes('SCHEDULE')?'active':''}" href="#"><span class="side-dot"></span>${t('الجدول','Schedule')}</a><a class="side-item ${baseline.includes('APPOINTMENT')?'active':''}" href="#"><span class="side-dot"></span>${t('المواعيد','Appointments')}</a></nav>`}
  function body(){if(baseline.includes('DISCOVER'))return discover();if(baseline.includes('DOCTOR'))return doctor();if(baseline.includes('BOOK'))return booking();if(baseline.includes('PAT-APPOINTMENT')||baseline.includes('CLN-APPOINTMENT'))return appointment();if(baseline.includes('TODAY'))return today();if(baseline.includes('QUEUE'))return queue();return schedule()}
  const result=state==='success'?`<section class="alert success result-region" role="status"><div class="alert-icon">✓</div><div><h2>${t('تم حفظ النتيجة','Result saved')}</h2><p>${t('الحالة مؤكدة · المرجع ','Status confirmed · Reference ')}${iso('APT-009-1842')} · 10:18 · ${t('الخطوة التالية: عرض التفاصيل','Next: view details')}</p></div></section>`:'';
  document.getElementById('root').innerHTML=`<div class="app ${app}"><header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span><span>${t('شفاء','SHIFAA')}</span></div><div class="top-actions"><button class="locale">${ar?'EN':'ع'}</button><div class="avatar">${app==='clinic'?t('ط','DR'):'009'}</div></div></header><div class="shell">${app==='clinic'?sidebar():''}<main class="workspace" id="main">${app==='clinic'?clinicContext():patientContext()}<header class="page-head"><div><p class="eyebrow">${app==='clinic'?t('تشغيل العيادة','Clinic operations'):t('الرعاية والمواعيد','Care & appointments')}</p><h1 tabindex="-1">${info[1]}</h1><p>${info[2]}</p></div><div class="fresh">${t('محدث الآن','Current')}</div></header>${banner}${body()}${result}</main></div>${app==='patient'?`<nav class="bottom-nav" aria-label="${t('التنقل الرئيسي','Primary navigation')}"><button class="nav-item"><span class="nav-symbol">⌂</span>${t('الرئيسية','Home')}</button><button class="nav-item active"><span class="nav-symbol">⌕</span>${t('اكتشف','Discover')}</button><button class="nav-item"><span class="nav-symbol">◷</span>${t('المواعيد','Appointments')}</button><button class="nav-item"><span class="nav-symbol">○</span>${t('حسابي','Profile')}</button></nav>`:''}<div class="evidence-tag">${baseline} · ${state} · ${locale} · ${info[0]}</div>${confirmation()}</div>`;
  document.fonts.ready.then(()=>document.documentElement.dataset.ready='true');
